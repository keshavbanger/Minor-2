<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Quiz | StreamSmart</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>

<body class="quiz-page">

    <header class="quiz-header">
        <a href="index.html" class="logo">
            <i class="fas fa-graduation-cap"></i> StreamSmart
        </a>

        <div class="progress-container">
            <p id="progress-text" class="progress-text">Question 1 of 12</p>
            <div class="progress-bar-bg">
                <div id="progress-bar" class="progress-bar-fill"></div>
            </div>
        </div>

        <a href="index.html" class="btn btn-exit" title="Exit Quiz">
            <i class="fas fa-times"></i>
        </a>
    </header>

    <main class="quiz-main">
        <div id="question-container" class="question-container">
            <h2 id="question-text" class="question-text">Which subject do you enjoy the most?</h2>

            <div id="options-grid" class="options-grid">
                <!-- Options will be injected by JS -->
            </div>
        </div>
    </main>

    <footer class="quiz-footer-nav"
        style="background: var(--color-white); border-top: 1px solid var(--color-border); width: 100%;">
        <div class="quiz-footer">
            <button id="btn-back" class="btn btn-nav btn-back" style="display: none;">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <div id="motto-text" class="motto-text">Focus and answer honestly!</div>
            <button id="btn-next" class="btn btn-nav btn-next">
                Next <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </footer>

    <!-- Data and Script -->
    <script src="data/quiz-questions.js"></script>
    <script src="js/quiz.js"></script>

    <!-- 
  STREAMSMART: MARG CHATBOT WIDGET SNIPPET
  Paste this before </body> on every page. 
-->
    <div id="marg-chatbot-container">
        <!-- Chat Bubble -->
        <button id="chat-bubble" class="chat-bubble pulse" onclick="ChatBot.open()" aria-label="Open Career Chatbot">
            🎓
            <span id="chat-notification" class="notification-dot"></span>
        </button>

        <!-- Chat Window -->
        <div id="chat-window" class="chat-window">
            <!-- Header -->
            <div class="chat-header">
                <div class="header-left">
                    <div class="bot-avatar-header">🎓</div>
                    <div class="header-info">
                        <span class="bot-name">Marg</span>
                        <div class="status-wrapper">
                            <span class="status-dot"></span>
                            <span class="status-text">Your Career Guide • Online</span>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button onclick="ChatBot.minimize()" title="Minimize">─</button>
                    <button onclick="ChatBot.close()" title="Close">✕</button>
                </div>
            </div>

            <!-- Body -->
            <div id="chat-body" class="chat-body">
                <!-- Typing Indicator -->
                <div id="typing-indicator" class="typing-indicator">
                    <div class="bot-avatar">🎓</div>
                    <div class="typing-bubble">
                        <span></span><span></span><span></span>
                    </div>
                    <small style="font-size: 10px; color: #9ca3af; margin-bottom: 5px;">Marg is typing...</small>
                </div>
            </div>

            <!-- Quick Actions Bar -->
            <div class="quick-actions-bar">
                <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Which stream should I choose?')">
                    <i class="fas fa-bullseye"></i>
                    <span>Streams</span>
                </button>
                <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('What degrees are available?')">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Degrees</span>
                </button>
                <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Show me entrance exams')">
                    <i class="fas fa-file-alt"></i>
                    <span>Exams</span>
                </button>
                <button class="quick-action-btn"
                    onclick="ChatBot.handleQuickReply('Tell me about government colleges')">
                    <i class="fas fa-university"></i>
                    <span>Colleges</span>
                </button>
                <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Show me scholarships')">
                    <i class="fas fa-hand-holding-usd"></i>
                    <span>Scholarships</span>
                </button>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <input type="text" id="chat-input" class="chat-input"
                    placeholder="Ask me about JEE, NEET, CA, or Streams..." maxlength="400">
                <button id="chat-send" class="chat-send-btn" onclick="ChatBot.sendFromInput()" disabled>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/animations.js"></script>
    <script src="js/chatbot-knowledge.js"></script>
    <script src="js/chatbot.js"></script>
</body>

</html>
