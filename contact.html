<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Feedback | StreamSmart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>

<body>

    <nav class="navbar scrolled">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-graduation-cap"></i> StreamSmart
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container" style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 60px;">
            <div>
                <h1>Get in Touch</h1>
                <p style="margin-top: 20px; font-size: 18px;">We're here to help students and parents navigate the
                    complex world of career choices.</p>

                <div style="margin-top: 40px;">
                    <div style="display: flex; gap: 15px; margin-bottom: 25px;">
                        <i class="fas fa-envelope fa-2x" style="color: var(--color-primary);"></i>
                        <div>
                            <h4>Email Us</h4>
                            <p>support@streamsmart.in</p>
                        </div>
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <i class="fas fa-map-marker-alt fa-2x" style="color: var(--color-primary);"></i>
                        <div>
                            <h4>Location</h4>
                            <p>Bhopal, Madhya Pradesh, India</p>
                        </div>
                    </div>
                </div>
            </div>

            <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: var(--shadow-md);">
                <h3>Send us Feedback</h3>
                <form id="contact-form"
                    onsubmit="event.preventDefault(); showToast('Feedback submitted successfully!', 'success'); this.reset();">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px;">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="Your Email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select required>
                            <option value="">I am a...</option>
                            <option value="student">Student</option>
                            <option value="parent">Parent</option>
                            <option value="teacher">Teacher</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea
                            style="width: 100%; padding: 15px; border: 1px solid var(--color-border); border-radius: 12px; font-family: inherit; height: 120px;"
                            placeholder="How can we help you?" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-register btn-large" style="width: 100%;">Submit
                        Feedback</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-bottom" style="border: none;">
            <p>&copy; 2026 StreamSmart. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/toast.js"></script>
    <!-- Chatbot Scripts -->
    <script src="js/chatbot-knowledge.js"></script>
    <script src="js/chatbot.js"></script>
</body>

</html>
