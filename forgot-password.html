<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | StreamSmart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>

<body class="auth-page">

    <div class="auth-card" style="text-align: center;">
        <div class="auth-header">
            <a href="index.html" style="font-size: 24px; font-weight: 700; color: var(--color-primary);">
                <i class="fas fa-graduation-cap"></i> StreamSmart
            </a>
            <h2 style="margin-top: 20px;">Reset Password</h2>
            <p style="font-size: 14px; color: var(--color-text-light);">We'll send you a link to reset your password.
            </p>
        </div>

        <form onsubmit="event.preventDefault(); showToast('Reset link sent to your email!', 'success');">
            <div class="form-group" style="text-align: left;">
                <label>Email Address</label>
                <input type="email" placeholder="example@email.com" required>
            </div>

            <button type="submit" class="btn btn-auth">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            Remembered your password? <a href="login.html">Login here</a>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <!-- Chatbot Scripts -->
    <script src="js/chatbot-knowledge.js"></script>
    <script src="js/chatbot.js"></script>
</body>

</html>
