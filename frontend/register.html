<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | StreamSmart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>

<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" style="font-size: 24px; font-weight: 700; color: var(--color-primary);">
                <i class="fas fa-graduation-cap"></i> StreamSmart
            </a>
            <h2 style="margin-top: 20px;">Join StreamSmart</h2>
            <p style="font-size: 14px; color: var(--color-text-light);">Start your journey to a better career.</p>
        </div>

        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="phone" placeholder="10-digit number" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label>Current Class</label>
                <select id="class-select" required>
                    <option value="">Select your class</option>
                    <option value="Class 10">Class 10</option>
                    <option value="Class 12">Class 12</option>
                    <option value="Already Passed">Already passed 12th</option>
                </select>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" placeholder="Min. 8 characters" minlength="8" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('password')"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
            </div>

            <button type="submit" class="btn btn-auth">Create My Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
