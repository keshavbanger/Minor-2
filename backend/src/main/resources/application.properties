# Server
server.port=8080
server.servlet.context-path=/

# Database (MongoDB Atlas)
spring.data.mongodb.uri=mongodb+srv://<username>:<password>@cluster0.your-url.mongodb.net/careerpath_db?retryWrites=true&w=majority

# Logging
logging.level.org.springframework.data.mongodb=DEBUG

# JWT Security
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=604800000

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# File Upload
spring.servlet.multipart.max-file-size=10MB

# CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://streamsmart.vercel.app}

# Logging
logging.level.com.careerpath=INFO

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
