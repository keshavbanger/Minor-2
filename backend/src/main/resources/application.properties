# Server
server.port=8080
server.servlet.context-path=/

# Database (H2 - The Easy Way for Minor Project)
spring.datasource.url=jdbc:h2:file:./data/careerpath;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (See your data at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway (Optional with ddl-auto=update, but kept for schema management)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Security
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=604800000

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# File Upload
spring.servlet.multipart.max-file-size=10MB

# CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://streamsmart.vercel.app}

# Logging
logging.level.com.careerpath=INFO
