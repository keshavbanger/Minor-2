<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Roadmaps | StreamSmart</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/degrees.css"> <!-- Reusing filters -->
    <link rel="stylesheet" href="css/roadmap.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>

<body>

    <nav class="navbar scrolled">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-graduation-cap"></i> StreamSmart
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="quiz.html" class="nav-link">Career Quiz</a>
                <a href="degrees.html" class="nav-link">Explore Degrees</a>
                <a href="roadmap.html" class="nav-link">Career Paths</a>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <header class="explorer-header" style="text-align: center;">
        <div class="container">
            <h1>Career Roadmaps</h1>
            <p>Visualizing your journey from Class 10 to a successful career</p>
        </div>
    </header>

    <div class="filter-bar">
        <div class="container" style="display: flex; justify-content: center;">
            <div class="stream-tabs">
                <div class="stream-tab active" data-stream="science">Science</div>
                <div class="stream-tab" data-stream="commerce">Commerce</div>
                <div class="stream-tab" data-stream="arts">Arts</div>
            </div>
        </div>
    </div>

    <section class="section">
        <div class="container roadmap-container">
            <div id="roadmap-list">
                <!-- Data will be injected -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-bottom" style="border: none;">
            <p>&copy; 2026 StreamSmart. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="data/career-roadmaps.js"></script>
    <script>
        function renderRoadmaps(stream) {
            const list = document.getElementById('roadmap-list');
            const data = roadmapData[stream];

            list.innerHTML = data.map(path => `
                <div class="roadmap-card">
                    <h3 style="margin-bottom: var(--spacing-lg); color: var(--color-primary);">${path.title}</h3>
                    <div class="timeline">
                        ${path.steps.map(step => `
                            <div class="timeline-item">
                                <div class="timeline-dot"></div>
                                <div class="timeline-content">
                                    <div class="timeline-icon">
                                        <i class="fas ${step.icon}"></i>
                                    </div>
                                    <div class="timeline-text">
                                        <h4>${step.label}</h4>
                                        <p>${step.detail}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        document.querySelectorAll('.stream-tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.stream-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderRoadmaps(tab.dataset.stream);
            };
        });

        // Init
        renderRoadmaps('science');
    </script>

    <!-- 
  STREAMSMART: MARG CHATBOT WIDGET SNIPPET
  Paste this before </body> on every page. 
-->
    <div id="marg-chatbot-container">
        <!-- Chat Bubble -->
        <button id="chat-bubble" class="chat-bubble pulse" onclick="ChatBot.open()" aria-label="Open Career Chatbot">
            🎓
            <span id="chat-notification" class="notification-dot"></span>
        </button>

        <!-- Chat Window -->
        <div id="chat-window" class="chat-window">
            <!-- Header -->
            <div class="chat-header">
                <div class="header-left">
                    <div class="bot-avatar-header">🎓</div>
                    <div class="header-info">
                        <span class="bot-name">Marg</span>
                        <div class="status-wrapper">
                            <span class="status-dot"></span>
                            <span class="status-text">Your Career Guide • Online</span>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button onclick="ChatBot.minimize()" title="Minimize">─</button>
                    <button onclick="ChatBot.close()" title="Close">✕</button>
                </div>
            </div>

            <!-- Body -->
            <div id="chat-body" class="chat-body">
                <!-- Typing Indicator -->
                <div id="typing-indicator" class="typing-indicator">
                    <div class="bot-avatar">🎓</div>
                    <div class="typing-bubble">
                        <span></span><span></span><span></span>
                    </div>
                    <small style="font-size: 10px; color: #9ca3af; margin-bottom: 5px;">Marg is typing...</small>
                </div>
            </div>

            <!-- Quick Actions Bar -->
            <div class="quick-actions-bar">
                <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Which stream should I choose?')">
                    <i class="fas fa-bullseye"></i>
                    <span>Streams</span>
                </button>
                <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('What degrees are available?')">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Degrees</span>
                </button>
                <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Show me entrance exams')">
                    <i class="fas fa-file-alt"></i>
                    <span>Exams</span>
                </button>
                <button class="quick-action-btn"
                    onclick="ChatBot.handleQuickReply('Tell me about government colleges')">
                    <i class="fas fa-university"></i>
                    <span>Colleges</span>
                </button>
                <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Show me scholarships')">
                    <i class="fas fa-hand-holding-usd"></i>
                    <span>Scholarships</span>
                </button>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <input type="text" id="chat-input" class="chat-input"
                    placeholder="Ask me about JEE, NEET, CA, or Streams..." maxlength="400">
                <button id="chat-send" class="chat-send-btn" onclick="ChatBot.sendFromInput()" disabled>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/animations.js"></script>
    <script src="js/chatbot-knowledge.js"></script>
    <script src="js/chatbot.js"></script>
</body>

</html>
