<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | StreamSmart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>

<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" style="font-size: 24px; font-weight: 700; color: var(--color-primary);">
                <i class="fas fa-graduation-cap"></i> StreamSmart
            </a>
            <h2 style="margin-top: 20px;">Join StreamSmart</h2>
            <p style="font-size: 14px; color: var(--color-text-light);">Start your journey to a better career.</p>
        </div>

        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="phone" placeholder="10-digit number" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label>Current Class</label>
                <select id="class-select" required>
                    <option value="">Select your class</option>
                    <option value="Class 10">Class 10</option>
                    <option value="Class 12">Class 12</option>
                    <option value="Already Passed">Already passed 12th</option>
                </select>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" placeholder="Min. 8 characters" minlength="8" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('password')"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
            </div>

            <button type="submit" class="btn btn-auth">Create My Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    
<!-- 
  STREAMSMART: MARG CHATBOT WIDGET SNIPPET
  Paste this before </body> on every page. 
-->
<div id="marg-chatbot-container">
    <!-- Chat Bubble -->
    <button id="chat-bubble" class="chat-bubble pulse" onclick="ChatBot.open()" aria-label="Open Career Chatbot">
        🎓
        <span id="chat-notification" class="notification-dot"></span>
    </button>

    <!-- Chat Window -->
    <div id="chat-window" class="chat-window">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-left">
                <div class="bot-avatar-header">🎓</div>
                <div class="header-info">
                    <span class="bot-name">Marg</span>
                    <div class="status-wrapper">
                        <span class="status-dot"></span>
                        <span class="status-text">Your Career Guide • Online</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button onclick="ChatBot.minimize()" title="Minimize">─</button>
                <button onclick="ChatBot.close()" title="Close">✕</button>
            </div>
        </div>

        <!-- Body -->
        <div id="chat-body" class="chat-body">
            <!-- Typing Indicator -->
            <div id="typing-indicator" class="typing-indicator">
                <div class="bot-avatar">🎓</div>
                <div class="typing-bubble">
                    <span></span><span></span><span></span>
                </div>
                <small style="font-size: 10px; color: #9ca3af; margin-bottom: 5px;">Marg is typing...</small>
            </div>
        </div>

        <!-- Quick Actions Bar -->
        <div class="quick-actions-bar">
            <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Which stream should I choose?')">
                <i class="fas fa-bullseye"></i>
                <span>Streams</span>
            </button>
            <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('What degrees are available?')">
                <i class="fas fa-graduation-cap"></i>
                <span>Degrees</span>
            </button>
            <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Show me entrance exams')">
                <i class="fas fa-file-alt"></i>
                <span>Exams</span>
            </button>
            <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Tell me about government colleges')">
                <i class="fas fa-university"></i>
                <span>Colleges</span>
            </button>
            <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Show me scholarships')">
                <i class="fas fa-hand-holding-usd"></i>
                <span>Scholarships</span>
            </button>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input"
                placeholder="Ask me about JEE, NEET, CA, or Streams..." maxlength="400">
            <button id="chat-send" class="chat-send-btn" onclick="ChatBot.sendFromInput()" disabled>
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="js/chatbot-knowledge.js"></script>
<script src="js/chatbot.js"></script>
</body>

</html>
