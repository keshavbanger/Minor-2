<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StreamSmart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>

<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" style="font-size: 24px; font-weight: 700; color: var(--color-primary);">
                <i class="fas fa-graduation-cap"></i> StreamSmart
            </a>
            <h2 style="margin-top: 20px;">Welcome Back</h2>
            <p style="font-size: 14px; color: var(--color-text-light);">Log in to access your saved career paths.</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email or Mobile</label>
                <input type="text" id="email" placeholder="Enter email or mobile" required>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between;">
                    <label>Password</label>
                    <a href="forgot-password.html" style="font-size: 12px; color: var(--color-primary);">Forgot
                        Password?</a>
                </div>
                <div class="password-input-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('password')"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-auth">Login to My Account</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <!-- Chatbot Scripts -->
    <script src="js/chatbot-knowledge.js"></script>
    <script src="js/chatbot.js"></script>
</body>

</html>
