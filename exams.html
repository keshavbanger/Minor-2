<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrance Exam Tracker | StreamSmart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/degrees.css">

    <style>
        .exam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 25px;
        }

        .exam-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border);
            transition: var(--transition);
        }

        .exam-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .exam-strip {
            height: 6px;
        }

        .exam-content {
            padding: 25px;
        }

        .exam-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-open {
            background: #dcfce7;
            color: #166534;
        }

        .status-upcoming {
            background: #e0f2fe;
            color: #075985;
        }

        .status-closed {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 768px) {
            .exam-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="css/chatbot.css">
</head>

<body>

    <nav class="navbar scrolled">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-graduation-cap"></i> StreamSmart
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="exams.html" class="nav-link active">Entrance Exams</a>
                <a href="scholarships.html" class="nav-link">Scholarships</a>
                <a href="colleges.html" class="nav-link">Colleges</a>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <header class="explorer-header">
        <div class="container">
            <h1>Entrance Exam Tracker</h1>
            <p>Stay updated with application deadlines and exam dates for 2026-27.</p>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div id="exam-list" class="exam-grid">
                <!-- Data will be injected -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-bottom" style="border: none;">
            <p>&copy; 2026 StreamSmart. All rights reserved.</p>
        </div>
    </footer>

    <script src="data/entrance-exams.js"></script> <!-- Fallback data -->
    <script src="js/api.js"></script>
    <script>
        async function loadExams() {
            const list = document.getElementById('exam-list');
            let data = [];

            try {
                // Try to fetch from API
                const response = await fetch('http://localhost:8080/api/v1/exams');
                if (response.ok) data = await response.json();
                else throw new Error();
            } catch (e) {
                // Fallback to local data
                data = [
                    { name: 'JEE Main', shortName: 'JEE Main', body: 'NTA', stream: 'science', start: 'Nov 2025', end: 'Dec 2025', date: 'Jan 20, 2026', status: 'Upcoming', fee: '₹650' },
                    { name: 'NEET UG', shortName: 'NEET UG', body: 'NTA', stream: 'science', start: 'Feb 9, 2026', end: 'Mar 9, 2026', date: 'May 4, 2026', status: 'Open', fee: '₹1700' },
                    { name: 'CUET UG', shortName: 'CUET UG', body: 'NTA', stream: 'all', start: 'Feb 20, 2026', end: 'Mar 26, 2026', date: 'May 15, 2026', status: 'Upcoming', fee: '₹650' },
                    { name: 'CLAT', shortName: 'CLAT', body: 'Consortium', stream: 'arts', start: 'Closed', end: 'Closed', date: 'Dec 1, 2025', status: 'Closed', fee: '₹4000' }
                ];
            }

            list.innerHTML = data.map(exam => `
                <div class="exam-card">
                    <div class="exam-strip" style="background: var(--color-${exam.stream || 'primary'})"></div>
                    <div class="exam-content">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
                            <div>
                                <span class="exam-badge status-${exam.status.toLowerCase()}">${exam.status}</span>
                                <h3 style="margin-top: 10px;">${exam.shortName}</h3>
                                <p style="font-size: 13px; color: var(--color-text-light);">${exam.body || 'National Testing Agency'}</p>
                            </div>
                            <div style="text-align: right;">
                                <p style="font-weight: 700; color: var(--color-success);">${exam.fee}</p>
                            </div>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; font-size: 14px;">
                            <div><i class="fas fa-calendar-plus" style="margin-right: 8px;"></i> Starts: ${exam.start}</div>
                            <div><i class="fas fa-calendar-check" style="margin-right: 8px;"></i> Ends: ${exam.end}</div>
                            <div style="font-weight: 600; color: var(--color-primary);"><i class="fas fa-edit" style="margin-right: 8px;"></i> Exam: ${exam.date}</div>
                            <div><i class="fas fa-poll" style="margin-right: 8px;"></i> Result: June 2026</div>
                        </div>

                        <div style="display: flex; gap: 10px; margin-top: 25px;">
                            <a href="#" class="btn btn-register" style="flex: 1; font-size: 13px;">View Details</a>
                            <a href="#" class="btn btn-login" style="flex: 1; font-size: 13px;">Official Link <i class="fas fa-external-link-alt" style="margin-left: 5px; font-size: 10px;"></i></a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        loadExams();
    </script>

    <!-- 
  STREAMSMART: MARG CHATBOT WIDGET SNIPPET
  Paste this before </body> on every page. 
-->
    <div id="marg-chatbot-container">
        <!-- Chat Bubble -->
        <button id="chat-bubble" class="chat-bubble pulse" onclick="ChatBot.open()" aria-label="Open Career Chatbot">
            🎓
            <span id="chat-notification" class="notification-dot"></span>
        </button>

        <!-- Chat Window -->
        <div id="chat-window" class="chat-window">
            <!-- Header -->
            <div class="chat-header">
                <div class="header-left">
                    <div class="bot-avatar-header">🎓</div>
                    <div class="header-info">
                        <span class="bot-name">Marg</span>
                        <div class="status-wrapper">
                            <span class="status-dot"></span>
                            <span class="status-text">Your Career Guide • Online</span>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button onclick="ChatBot.minimize()" title="Minimize">─</button>
                    <button onclick="ChatBot.close()" title="Close">✕</button>
                </div>
            </div>

            <!-- Body -->
            <div id="chat-body" class="chat-body">
                <!-- Typing Indicator -->
                <div id="typing-indicator" class="typing-indicator">
                    <div class="bot-avatar">🎓</div>
                    <div class="typing-bubble">
                        <span></span><span></span><span></span>
                    </div>
                    <small style="font-size: 10px; color: #9ca3af; margin-bottom: 5px;">Marg is typing...</small>
                </div>
            </div>

            <!-- Quick Actions Bar -->
            <div class="quick-actions-bar">
                <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Which stream should I choose?')">
                    <i class="fas fa-bullseye"></i>
                    <span>Streams</span>
                </button>
                <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('What degrees are available?')">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Degrees</span>
                </button>
                <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Show me entrance exams')">
                    <i class="fas fa-file-alt"></i>
                    <span>Exams</span>
                </button>
                <button class="quick-action-btn"
                    onclick="ChatBot.handleQuickReply('Tell me about government colleges')">
                    <i class="fas fa-university"></i>
                    <span>Colleges</span>
                </button>
                <button class="quick-action-btn" onclick="ChatBot.handleQuickReply('Show me scholarships')">
                    <i class="fas fa-hand-holding-usd"></i>
                    <span>Scholarships</span>
                </button>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <input type="text" id="chat-input" class="chat-input"
                    placeholder="Ask me about JEE, NEET, CA, or Streams..." maxlength="400">
                <button id="chat-send" class="chat-send-btn" onclick="ChatBot.sendFromInput()" disabled>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/animations.js"></script>
    <script src="js/chatbot-knowledge.js"></script>
    <script src="js/chatbot.js"></script>
</body>

</html>
